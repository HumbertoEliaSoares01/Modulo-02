<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercício 021-B</title>
    <style>
        h1{ /* box-level*/
            background-color: lightgray;
            height: 300px; width: 300px;
            
            /*
            border-width: 10px; border-style: solid; border-color: darkgray;
            */
            border: 10px solid darkgray;    /* shorthand*/
            /*
            padding-top: 10px; padding-right: 10px;
            padding-bottom: 10px; padding-left: 10px;
            */
            padding: 10px;  /* shorthand */
            /*
            margin-top: 40px; margin-right: 20px;
            margin-bottom: 40px; margin-left: 20px;

            margin: 40px 20px;     shorthand */
            
            margin: 40px auto;    centralizando
                        
            outline-width: 5px;
            outline-style: dashed;
            outline-color: salmon;
        }
        a{  /* inline-level */
            border-width: 10px;
            border-style: solid;
            border-color: red;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p> 
        Parágrafos também são exemplos de caixas box-level, mas os <a href="#">links</a> são caixas inline-level. Vamos ver como tudo isso funciona.
    </p>

</body>
</html>
