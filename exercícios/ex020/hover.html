<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercício 020 - b</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.5em;
            text-align: center;
        }
        div{
            width: 200px; 
            text-align: center;
            display: block;
            margin: 25px auto;
            border: 2px solid red;
            height: 100px; width: 300px;
        }
        div:hover{color: red;}
        div > p{
            display: none; 
            padding: 10px;
            margin: 10px;
        }
        div:hover > p {display: block; background-color: red; color: #fff   ;}
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Passe o mouse sobre o texto abaixo</p>
    <div>Passe o mouse aqui
        <p>TEXTO ESCONDIDO</p>
    </div>
    <p>Fim do exemplo</p>
    <img src="../Imagens/20002.png" alt="">
</body>
</html>
