<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercício 018</title>
    <style>
        html{
            margin: 0px; padding: 0px;
            background-color: #f00;
        }
        body{
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
            background-color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.5em;
        }
        h1, h2 {
            font-family: 'Times New Roman', Times, serif; 
            padding: 0px 10px 0px 10px;
        }
        h1{text-align: center;}
        p {text-align: justify; text-indent: 30px;}
        dl dt {color: red;}
        dl dd {color: green;} 
        hr{
            border-color: #f00;
            width: 600px;
        } 
</style>
</head>
<body>
    <h1>font-size</h1> <hr>
    
    <dl style="margin-left: 100px; margin-top: 50px;">
        <h2>Medidas absolutas</h2>
        <p>
            <dt>cm</dt> <dd>(centímetro)</dd>
            <dt>mm</dt> <dd>(milímetro)</dd> 
            <dt>in</dt> <dd>(polegada)</dd>
            <dt>px</dt> <dd>(pixel)</dd> 
            <dt>pt</dt> <dd>(ponto)</dd> 
            <dt>pc</dt> <dd>(paica)</dd>
        </p>
    </dl>
    <dl style="position: absolute; right: 100px; top: 160px;" >
        <h2 style=>Medidas relativas</h2>
        <p> <dt>em</dt> <dd>(altura do "M" maiúsculo)</dd> 
            <dt>ex</dt> <dd>(altura do "x")</dd> 
            <dt>rem</dt> <dd>(em da fonte configurada no body)</dd> 
            <dt>vw</dt> <dd>(relativo ao tamanho da tela)</dd>
            <dt>vh</dt> <dd>(relativo ao tamanho da tela)</dd>
            <dt>%</dt> <dd>(percetagem)</dd>
         </p>
    </dl>
    
</body>
</html>
